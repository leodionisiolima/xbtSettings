format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$rust\
$nodejs\
$line_break\
$character"""
add_newline = true

[username]
format = "[$user@](bold green)"
show_always = true

[hostname]
format = "[$hostname](bold cyan) "
ssh_only = false

[directory]
format = "[📁 $path](bold blue)"
truncation_length = 3
home_symbol = "~"
read_only = " 🔒"
style = "bold blue"

[git_branch]
format = "[$symbol$branch](bold purple)"
symbol = "🌿 "

[git_status]
format = "([\\[$all_status$ahead_behind\\]](bold red))"
ahead = "⇡ ${count}"
behind = "⇣ ${count}"
conflicted = "="
deleted = "✘"
diverged = "⇕ ⇡${ahead_count}⇣${behind_count}"
modified = "!"
renamed = "»"
staged = "\\+\\(${count}\\)"
stashed = "$"
untracked = "?"

[python]
format = "[🐍 $version](bold yellow) "
symbol = "🐍 "
detect_extensions = ["py"]
detect_files = [".python-version", "Pipfile", "__pycache__", "pyproject.toml", "requirements.txt", "setup.py", "tox.ini"]

[rust]
format = "[🦀 $version](bold red) "
symbol = "🦀 "
detect_extensions = ["rs"]
detect_files = ["Cargo.toml", "Cargo.lock"]

[nodejs]
format = "[⬢ $version](bold green) "
symbol = "⬢ "
detect_extensions = ["js", "mjs", "cjs", "ts", "jsx", "tsx"]
detect_files = ["package.json", ".node-version"]

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

