format = """
$shell • $username$hostname • $directory$git_branch
$character
"""

[character]
success_symbol = "[❯](bold blue)"
error_symbol = "[❯](bold red)"

[shell]
disabled = false
format = "[$indicator]($style)"
style = "yellow bold"
bash_indicator = "bash"
zsh_indicator = "zsh"
fish_indicator = "fish"
powershell_indicator = "pwsh"

[username]
show_always = true
format = "[$user[@](green bold)]($style)"
style_user = "green bold"

[hostname]
ssh_only = false
format = "[$hostname]($style)"
style = "green bold"

[directory]
truncation_length = 1
truncate_to_repo = true
format = "[$path]($style)"
style = "bright-blue bold"

[git_branch]
disabled = false
format = " • 🌿 [$symbol$branch]($style)"
symbol = ""
style = "purple bold"
